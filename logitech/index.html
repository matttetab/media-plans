@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#00001E; --fg:#F5F5FF; --surface:#0C0C36; --muted:#B4B4D8; --line:#26265E; --soft:#16164A;
    --input:#1C1640; --input-line:#3A2E6A; --partner:#F5F5FF; --partner-ink:#00001E; --fee:#6E6E96;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#00001E; --fg:#F5F5FF; --surface:#0C0C36; --muted:#B4B4D8; --line:#26265E; --soft:#16164A;
  --input:#1C1640; --input-line:#3A2E6A; --partner:#F5F5FF; --partner-ink:#00001E; --fee:#6E6E96;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--zm-font-body);font-size:18px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--zm-blue);outline-offset:2px;border-radius:6px}
img{max-width:100%}
h1,h2,h3{margin:0;font-family:var(--zm-font-display);font-weight:900;text-transform:uppercase;letter-spacing:.005em;line-height:.95}
h2{font-size:clamp(34px,4.6vw,58px)}
h3{font-size:24px;line-height:1.05}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px);position:relative}
.band{padding:clamp(48px,7vw,96px) 0;position:relative;overflow:hidden}
.lead{font-size:20px;color:var(--muted);max-width:44em;margin:10px 0 0}
.hidden{display:none!important}
.zm{text-transform:none!important;letter-spacing:inherit}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 16px;min-height:64px;flex-wrap:wrap;padding:8px clamp(16px,4vw,40px);max-width:1200px;margin:0 auto}
.lockup{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.zlogo{width:128px;aspect-ratio:1200/320;background:var(--zm-logo-horizontal-en-orange) no-repeat center/contain;flex:none}
.divider{width:1px;height:30px;background:var(--line)}
.plogo{height:30px;width:auto;max-width:150px;object-fit:contain}
.pl-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl-dark{display:block}:root:not([data-theme="light"]) .pl-light{display:none}}
:root[data-theme="dark"] .pl-dark{display:block}:root[data-theme="dark"] .pl-light{display:none}
footer .flogo{height:34px;width:auto;max-width:170px;object-fit:contain}
footer .lock{display:flex;align-items:center;gap:16px}footer .lock .divider{background:rgba(245,245,255,.3);height:34px}
/* objective explorer */
.objtabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.objtab{border:2px solid var(--oc);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 18px;font-weight:800;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.objtab small{font-weight:600;color:var(--muted);font-size:15px}
.objtab[aria-selected="true"]{background:var(--oc);color:var(--oink)}
.objtab[aria-selected="true"] small{color:inherit;opacity:.9}
.objpanel{margin-top:16px;background:var(--surface);border-radius:28px;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr}
.objpanel .side{background:var(--oc);color:var(--oink);padding:clamp(20px,3vw,32px);position:relative;overflow:hidden}
.objpanel .side h3{font-size:clamp(34px,4vw,48px);position:relative}
.objpanel .side p{position:relative;font-size:18px;margin:12px 0 0}
.objpanel .side dl{position:relative;grid-template-columns:1fr;gap:2px;margin-top:18px;font-size:16px}
.objpanel .side dt{opacity:.85;font-weight:600;margin-top:8px}.objpanel .side dd{color:inherit;font-weight:700}
.objpanel .side .rip{position:absolute;inset:0;opacity:.35;pointer-events:none}
.objpanel .main{padding:clamp(20px,3vw,32px)}
.ostats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ostat{background:var(--soft);border-radius:18px;padding:14px 16px}
.ostat .v{font-family:var(--num);font-weight:900;font-size:34px;line-height:1}
.ostat .l{font-size:15px;color:var(--muted);margin-top:4px}
.clickable{cursor:pointer}
.stack div.clickable:hover,.legend .clickable:hover{filter:brightness(1.08)}
.legend button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-align:left}
.legend button:hover{text-decoration:underline}
button.tag{border:0;cursor:pointer;font-family:inherit}
details.how{margin-top:10px;font-size:15px}
details.how summary{cursor:pointer;font-weight:700;color:var(--zm-blue)}
details.how div{margin-top:6px;color:var(--muted);line-height:1.6}
details.how b{color:var(--fg)}
.pname{font-family:var(--zm-font-display);font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;background:var(--soft);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted);font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--zm-orange);color:#fff}
.btn{border:2px solid var(--line);background:var(--surface);padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:16px}
.btn.primary{background:var(--zm-orange);border-color:var(--zm-orange);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:14px;color:var(--muted)}

/* hero */
.hero{background:var(--zm-orange);color:#fff}
.hero .rip{position:absolute;inset:0;pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;position:relative}
.kicker{font-size:20px;font-weight:700;opacity:.92}
.hero h1{font-size:clamp(52px,8vw,112px);margin:10px 0 18px}
.hero .when{font-size:22px;font-weight:600}
.hero-figs{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chip{background:color-mix(in srgb,#fff 18%,var(--zm-orange));border-radius:18px;padding:12px 18px;min-width:150px;position:relative;z-index:1}
.chip .v{font-family:var(--num);font-weight:900;font-size:34px;line-height:1}
.chip .l{font-size:15px;opacity:.92;margin-top:4px}
.disc{aspect-ratio:1;width:min(330px,80vw);margin:0 auto;border-radius:50%;background:#fff;color:var(--zm-oxford);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:1}
.disc .l{font-size:17px;font-weight:700;color:#4B4B6E}
.disc .v{font-family:var(--num);font-weight:900;font-size:clamp(54px,7vw,84px);line-height:1;color:var(--zm-orange);margin:8px 0 4px}
.disc .s{font-size:15px;color:#4B4B6E;margin-top:6px}

/* budget */
.cards{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:32px}
.card{background:var(--surface);border-radius:28px;padding:clamp(18px,2.5vw,28px);border:1px solid var(--line)}
.card h3{margin-bottom:14px}
.stack{display:flex;height:64px;border-radius:18px;overflow:hidden;gap:3px;background:var(--line)}
.stack div{min-width:3px;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden}
.stack .light{color:var(--zm-oxford)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:5px;flex:none;display:inline-block}
.rows{display:grid;gap:12px;margin-top:22px}
.row{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 90px 52px;gap:12px;align-items:center;font-size:16px}
.row .nm b{display:block;font-weight:700}
.row .nm small{color:var(--muted);font-size:14px}
.track{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px}
.row .v{text-align:right;font-weight:800}
.row .p{text-align:right;color:var(--muted);font-size:15px}
.split{display:flex;height:48px;border-radius:999px;overflow:hidden;gap:3px;margin:6px 0 12px}
.split div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;padding:0 10px}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:6px 18px;font-size:16px}
.kv .n{text-align:right;font-weight:700}
.kv .h{font-size:14px;color:var(--muted);text-align:right}
.kv .t{border-top:2px solid var(--fg);padding-top:6px;font-weight:800}
.kv .t.n{text-align:right}
.note{font-size:14px;color:var(--muted);margin-top:10px}

/* results */
.results{background:var(--zm-blue);color:#fff}
.results .lead{color:rgba(255,255,255,.88)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
.metric{background:rgba(255,255,255,.14);border-radius:28px;padding:20px 22px}
.metric .v{font-family:var(--num);font-weight:900;font-size:clamp(40px,4.5vw,58px);line-height:1}
.metric .l{font-size:17px;margin-top:6px}
.metric .d{font-size:14px;opacity:.85;margin-top:2px}
.calc{margin-top:22px;background:#fff;color:var(--zm-oxford);border-radius:28px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:14px 24px;align-items:center}
.calc label{font-weight:800;font-size:18px}
.calc .money{display:flex;align-items:center;gap:8px}
.calc input[type=number]{width:140px;border:2px solid var(--zm-blue);border-radius:14px;padding:8px 12px;font-weight:800;font-size:20px;background:#fff;color:var(--zm-oxford)}
.calc input[type=range]{width:100%;accent-color:var(--zm-orange)}
.calc .hint{grid-column:1/-1;font-size:15px;color:#4B4B6E}
.scen{display:inline-block;background:var(--zm-saffron);color:var(--zm-oxford);font-weight:800;border-radius:999px;padding:2px 12px;font-size:14px;margin-left:10px;vertical-align:middle}

/* ads */
.ads{display:grid;gap:14px;margin-top:30px}
.ad{display:grid;grid-template-columns:8px 1fr auto;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;align-items:center}
.ad .bar{align-self:stretch}
.ad .body{padding:16px 0}
.ad h3{font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.obj{color:#fff}
.facts{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:16px;color:var(--muted)}
.facts b{color:var(--fg)}
.ad .out{padding:16px 22px 16px 0;text-align:right;min-width:170px}
.ad .out .v{font-family:var(--num);font-weight:900;font-size:36px;line-height:1}
.ad .out .l{font-size:15px;color:var(--muted)}

/* creatives */
.creatives{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:30px}
.cre{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cre .img{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:12px}
.cre .img img{width:100%;height:100%;object-fit:cover}
.cre .img.has{padding:0}
.cre .in{padding:14px 16px 16px}
.cre .pr{font-family:var(--num);font-weight:900;font-size:32px;color:var(--zm-orange);line-height:1;margin-top:8px}
.cre small{color:var(--muted);font-size:14px}

/* timeline */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tl{min-width:680px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:14px 20px;margin-top:30px}
.tl-row{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:center;min-height:40px}
.tl-row+.tl-row{border-top:1px solid var(--line)}
.tl-label{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-label span{color:var(--muted)}
.tl-track{position:relative;height:40px}
.tl-weeks{position:absolute;inset:0;display:flex}
.tl-weeks div{flex:1;border-left:2px dotted var(--line);font-size:14px;color:var(--muted);padding-left:6px}
.tl-bar{position:absolute;top:12px;height:16px;border-radius:999px}

/* plan vs actual */
.pva{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;margin-top:30px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;font-weight:700;color:var(--muted)}
th.act{color:var(--zm-emerald)} td.act{background:color-mix(in srgb,var(--zm-emerald) 10%,transparent);font-weight:700}
tfoot td{font-weight:800;border-bottom:0}
.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}

details.gloss{margin-top:8px}
details.gloss summary{cursor:pointer;font-weight:800;font-size:20px}
dl{display:grid;grid-template-columns:190px 1fr;gap:8px 18px;font-size:16px;margin:16px 0 0;max-width:860px}
dt{font-weight:700}dd{margin:0;color:var(--muted)}
footer.foot{background:var(--zm-oxford);color:#F5F5FF;padding:36px 0}
footer .flex{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer .wlogo{width:140px;aspect-ratio:1200/320;background:var(--zm-logo-horizontal-en-white) no-repeat center/contain}
footer small{opacity:.8}

/* edit */
.edit main{padding:32px 0 100px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:18px}
.panel h3{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
label.f input,label.f select{background:var(--input);border:1px solid var(--input-line);border-radius:10px;padding:8px 10px;font-size:16px;color:var(--fg);min-width:0;width:100%}
label.f input[readonly]{background:var(--soft);border-color:var(--line)}
label.f input[type=color]{padding:2px;height:40px}
.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ehead h4{margin:0 auto 0 0;font-size:19px}
.live{margin-top:12px;font-size:15px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px}
.live b{color:var(--fg)}
.sub{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.sub summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--zm-emerald)}
.sub .grid{margin-top:10px}
.sub label.f input{background:color-mix(in srgb,var(--zm-emerald) 12%,var(--surface));border-color:color-mix(in srgb,var(--zm-emerald) 40%,var(--line))}
.imgrow{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:15px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);overflow:hidden;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.pl{width:100%;border-collapse:collapse}
.pl td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.pl input{background:var(--input);border:1px solid var(--input-line);border-radius:8px;padding:6px 8px;font-size:15px;width:100%;color:var(--fg)}
.banner{background:var(--zm-champagne-pink);color:var(--zm-oxford);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:2px dashed var(--line);border-radius:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--zm-oxford);color:#F5F5FF;padding:12px 18px;border-radius:999px;font-size:16px;z-index:40;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,30,.25)}

@media (max-width:860px){
  .hero-grid,.cards,.objpanel{grid-template-columns:1fr}
  .calc{grid-template-columns:1fr}
  .ad{grid-template-columns:8px 1fr}
  .ad .out{grid-column:2;text-align:left;padding:0 0 16px}
  .row{grid-template-columns:1fr 70px 46px}
  .row .track{grid-column:1/-1;grid-row:2}
  dl{grid-template-columns:1fr}
  .top .lockup{flex-basis:100%}
}
@media (max-width:520px){ .stack div span{display:none} .disc{width:min(260px,76vw)} .hero-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .chip{min-width:0;padding:10px 12px} .chip .v{font-size:26px} .chip .l{font-size:13px} }
@media print{ .top,.toast,.calc{display:none!important} body{background:#fff} .band{break-inside:avoid} }
</style>
</head>

/*
 * Zoommer ripples ("რიპლები") — SVG generator that follows the brand-book rules:
 *  - ring thickness and the gap between rings are equal and constant
 *  - rings follow the outline of the object they surround and share its centre
 *  - the first (innermost) ring is never broken
 *  - breaks are few and short; no very thin/dense or very thick/sparse rings
 *
 * Usage (browser or Node):
 *   ZoommerRipples.svg({width:800, height:500, cx:400, cy:250,
 *     shape:"circle", r:90,                 // or shape:"rect", w:260, h:140, rx:28
 *     rings:7, stroke:14, color:"#FFFFFF", opacity:1,
 *     fade:false,                           // true = gradient-style ripples (outer rings fade out)
 *     breaks:true, seed:3,                  // a few short gaps on outer rings
 *     background:"#FE5000"})                // optional full-bleed background
 *   -> returns an <svg> string. Insert it absolutely positioned behind the content.
 *
 * Keep stroke between ~1.5% and 3% of the shorter side of the area. 5–9 rings reads best.
 */
(function (root) {
  function ring(shape, o, i, opt) {
    var k = (i + 1) * opt.stroke * 2;            // gap == stroke
    if (shape === "rect") {
      var w = o.w + k * 2, h = o.h + k * 2, rx = (o.rx || 0) + k;
      return '<rect x="' + (opt.cx - w / 2) + '" y="' + (opt.cy - h / 2) + '" width="' + w + '" height="' + h +
             '" rx="' + rx + '" pathLength="100"';
    }
    return '<circle cx="' + opt.cx + '" cy="' + opt.cy + '" r="' + (o.r + k) + '" pathLength="100"';
  }
  function rnd(seed) { var s = seed || 1; return function () { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }

  function svg(opt) {
    opt = Object.assign({ shape: "circle", rings: 7, stroke: 14, color: "#FFFFFF", opacity: 1,
                          fade: false, breaks: true, seed: 3 }, opt || {});
    var shape = opt.shape === "rect" ? "rect" : "circle";
    var o = shape === "rect" ? { w: opt.w || 200, h: opt.h || 120, rx: opt.rx || 24 } : { r: opt.r || 80 };
    var R = rnd(opt.seed), out = [];
    out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + opt.width + ' ' + opt.height +
             '" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true">');
    if (opt.background) out.push('<rect width="100%" height="100%" fill="' + opt.background + '"/>');

var saved=JSON.parse(document.getElementById("plan-data").textContent);
var state=JSON.parse(JSON.stringify(saved));
var mode="present",canEdit=false,readOnly=false,dirty=false,saving=false,artifactNs=null,scenario=null;
var DRAFT_KEY="zm-media-plan-draft";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function nm(x){return esc(x).replace(/zoommer/gi,'<span class="zm">zoommer</span>');}
function nt(x){return esc(x).replace(/zoommer/gi,"zoommer");}
function ctitle(){var c=state.campaign;return c.name||((c.supplier||"Partner")+" × "+(c.retailer||"zoommer"));}
function num(v){return (typeof v==="number"&&isFinite(v))?v:null;}
function n0(v){return num(v)||0;}
var nf=new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
function fN(v){return num(v)==null?"–":nf.format(Math.round(v));}
function fM(v,dec){if(num(v)==null)return "–";var mx=dec||0;if(mx>=2&&v!==0&&Math.abs(v)<0.1)mx=Math.abs(v)<0.01?4:3;try{return new Intl.NumberFormat("en-US",{style:"currency",currency:state.campaign.currency||"USD",minimumFractionDigits:dec||0,maximumFractionDigits:mx}).format(v);}catch(e){return (state.campaign.currency||"")+" "+v.toFixed(dec||0);}}
function fP(v){return num(v)==null?"–":Math.round(v*100)+"%";}
function dt(s){if(!s)return null;var p=s.split("-");return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fD(s,yr){var x=dt(s);if(!x)return "–";return x.getUTCDate()+" "+MON[x.getUTCMonth()]+(yr?" "+x.getUTCFullYear():"");}
function days(a,b){var x=dt(a),y=dt(b);if(!x||!y)return null;return Math.round((y-x)/864e5)+1;}
function col(o){return "var("+(OBJ_COLOR[o]||"--muted")+")";}
function pname(k){return k==="supplier"?state.campaign.supplier:k==="retailer"?state.campaign.retailer:"Shared";}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4);}

function calc(l,f){
  f=f==null?1:f;
  var spend=n0(l.spend)*f;
  var impr=(num(l.cpm)&&l.cpm>0)?spend/l.cpm*1000:null;
  var rtype=OBJECTIVES[l.objective]||"results";
  var res=l.objective==="Awareness"?impr:((num(l.cpr)&&l.cpr>0)?spend/l.cpr:null);
  var reach=(impr!=null&&num(l.freq)&&l.freq>0)?impr/l.freq:null;
  var d=days(l.start,l.end);
  return {spend:spend,impr:impr,res:res,rtype:rtype,reach:reach,days:d,daily:d?spend/d:null};
}
function creCost(c){return n0(c.price)*(num(c.qty)==null?1:c.qty);}
function totals(f){
  var c=state.campaign,sh=num(c.supplierShare);if(sh==null)sh=.5;
  var t={spend:0,cre:0,impr:0,byType:{},spType:{},byObj:{},byPlat:{},sup:0,ret:0,supAd:0,retAd:0,supCre:0,retCre:0};
  function share(k){return k==="supplier"?1:k==="retailer"?0:sh;}
  state.lines.forEach(function(l){var k=calc(l,f);t.spend+=k.spend;t.impr+=k.impr||0;
    if(l.objective!=="Awareness"&&k.res!=null){t.byType[k.rtype]=(t.byType[k.rtype]||0)+k.res;t.spType[k.rtype]=(t.spType[k.rtype]||0)+k.spend;}
    t.byObj[l.objective]=(t.byObj[l.objective]||0)+k.spend;t.byPlat[l.platform]=(t.byPlat[l.platform]||0)+k.spend;
    var s=share(l.paidBy);t.supAd+=k.spend*s;t.retAd+=k.spend*(1-s);});
  state.creatives.forEach(function(cr){var v=creCost(cr);t.cre+=v;var s=share(cr.paidBy);t.supCre+=v*s;t.retCre+=v*(1-s);});
  t.fee=t.spend*n0(c.taxPct);t.sup=t.supAd+t.supCre;t.ret=t.retAd+t.retCre;t.total=t.spend+t.cre+t.fee;
  return t;
}

/* ---------- shell ---------- */
var app=document.getElementById("app");
function shell(){
  app.innerHTML='<div class="top"><div class="top-in"><div class="lockup" id="lockup"></div>'+
   '<div class="tabs hidden" id="tabs" role="group" aria-label="View"><button type="button" data-mode="present">Present</button><button type="button" data-mode="edit">Edit</button></div>'+
   '<span class="status hidden" id="status"></span><button type="button" class="btn ghost hidden" id="discard">Discard</button><button type="button" class="btn primary hidden" id="save">Save changes</button></div></div>'+
   '<div id="present"></div><div id="edit" class="edit hidden"></div>';
  document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setMode(b.getAttribute("data-mode"));});
  document.getElementById("save").addEventListener("click",save);
  document.getElementById("discard").addEventListener("click",function(){state=JSON.parse(JSON.stringify(saved));clearDraft();dirty=false;renderEdit();renderPresent();updateBar();});
}
function lockup(){
  var c=state.campaign;
  return '<span class="zlogo" role="img" aria-label="Zoommer"></span><span class="divider"></span>'+
    (c.partnerLogo?'<img class="plogo pl-light" src="'+esc(c.partnerLogo)+'" alt="'+nt(c.supplier)+'"><img class="plogo pl-dark" src="'+esc(c.partnerLogoDark||c.partnerLogo)+'" alt="'+nt(c.supplier)+'">':'<span class="pname">'+nm(c.supplier)+'</span>');
}
function applyPartnerColor(){
  var r=document.documentElement.style,c=state.campaign.partnerColor;
  if(c&&/^#[0-9a-f]{6}$/i.test(c)){r.setProperty("--partner",c);
    var R=parseInt(c.substr(1,2),16),G=parseInt(c.substr(3,2),16),B=parseInt(c.substr(5,2),16);
    r.setProperty("--partner-ink",(R*299+G*587+B*114)/1000>150?"#00001E":"#FFFFFF");}
  else{r.removeProperty("--partner");r.removeProperty("--partner-ink");}
}
function updateBar(){
  document.getElementById("lockup").innerHTML=lockup();
  document.title=nt(ctitle())+" — Media plan";
  var ok=canEdit&&!readOnly;
  document.getElementById("tabs").classList.toggle("hidden",!ok);
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===mode));});
  var ed=mode==="edit",st=document.getElementById("status");
  st.classList.toggle("hidden",!ed);st.textContent=saving?"Saving…":dirty?"Unsaved changes":"All changes saved";
  document.getElementById("save").classList.toggle("hidden",!ed);document.getElementById("save").disabled=!dirty||saving;
  document.getElementById("discard").classList.toggle("hidden",!ed||!dirty);
}
function setMode(m){
  if(m==="edit"&&!(canEdit&&!readOnly))m="present";
  mode=m;document.getElementById("present").classList.toggle("hidden",m!=="present");document.getElementById("edit").classList.toggle("hidden",m!=="edit");
  if(m==="present")renderPresent();else renderEdit();
  try{history.replaceState(null,"",m==="edit"?"#edit":location.pathname+location.search);}catch(e){}
  updateBar();window.scrollTo(0,0);
}
function toast(msg){var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3800);}

/* ---------- present ---------- */
function rowBar(name,sub,v,max,tot,color){
  return '<div class="row"><div class="nm"><b>'+name+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div><div class="track"><i style="width:'+(max?v/max*100:0)+'%;background:'+color+'"></i></div><div class="v">'+fM(v)+'</div><div class="p">'+fP(tot?v/tot:0)+'</div></div>';
}
function renderPresent(){
  applyPartnerColor();
  var c=state.campaign,t=totals(),L=state.lines,CR=state.creatives,h='';
  // hero
  h+='<section class="band hero"><div class="rip" id="heroRip"></div><div class="wrap hero-grid"><div>'+
     '<div class="kicker">Media plan for '+nm(c.supplier)+' and '+nm(c.retailer)+'</div>'+
     '<h1>'+nm(ctitle())+'</h1><div class="when">'+fD(c.start)+' – '+fD(c.end,true)+(days(c.start,c.end)?', '+days(c.start,c.end)+' days':'')+'</div>'+

  if(!L.length&&!CR.length){h+='<section class="band"><div class="wrap"><div class="empty">This plan has no ads yet.'+(canEdit&&!readOnly?' Switch to Edit to add the first one.':'')+'</div></div></section>';document.getElementById("present").innerHTML=h;drawRipples();return;}

  // budget
  var segs=[];Object.keys(OBJECTIVES).forEach(function(o){if(t.byObj[o])segs.push({n:o+" ads",v:t.byObj[o],c:col(o),light:LIGHT_OBJ[o],obj:o});});
  if(t.cre)segs.push({n:"Creative production",v:t.cre,c:"var(--cr)",light:1});
  if(t.fee)segs.push({n:"Tax / fees",v:t.fee,c:"var(--fee)"});
  h+='<section class="band"><div class="wrap"><h2>Where the budget goes</h2><p class="lead">Every '+esc(c.currency||"USD")+' of the '+fM(t.total)+' campaign: what is paid to the platforms for showing ads, and what is spent on making the creatives.</p>';
  h+='<div class="card" style="margin-top:30px"><div class="stack" role="img" aria-label="Budget split">';
  segs.forEach(function(s){var w=t.total?s.v/t.total*100:0;h+='<div class="'+(s.light?'light':'')+(s.obj?' clickable':'')+'"'+(s.obj?' data-obj="'+esc(s.obj)+'"':'')+' style="flex:'+w+' 0 0;background:'+s.c+'" title="'+esc(s.n)+': '+fM(s.v)+'">'+(w>9?'<span>'+fM(s.v)+'</span>':'')+'</div>';});
  h+='</div><div class="legend">';segs.forEach(function(s){var inner='<i class="sw" style="background:'+s.c+'"></i>'+esc(s.n)+' <b>'+fM(s.v)+'</b> ('+fP(t.total?s.v/t.total:0)+')';h+=s.obj?'<button type="button" data-obj="'+esc(s.obj)+'" title="Show what '+esc(s.obj)+' means">'+inner+'</button>':'<span>'+inner+'</span>';});h+='</div><p class="note">Tap a colour to see what each objective does.</p>';
  h+='<h3 style="margin-top:32px">Ad budget by format</h3><div class="rows">';
  var maxL=Math.max.apply(null,L.map(function(l){return n0(l.spend);}).concat([1]));
  L.forEach(function(l){h+=rowBar(esc(l.platform)+', '+esc(l.format),esc(l.objective)+(l.paidBy!=="shared"?', paid by '+nm(pname(l.paidBy)):''),n0(l.spend),maxL,t.spend,col(l.objective));});
  h+='</div></div>';
  h+='<div class="cards"><div class="card"><h3>Ad spend by platform</h3><p class="note" style="margin-top:-6px">Advertising cost only, without creative production.</p><div class="rows" style="margin-top:12px">';
  var maxP=Math.max.apply(null,Object.keys(t.byPlat).map(function(k){return t.byPlat[k];}).concat([1]));

  h+='</div></div><div class="card"><h3>Who pays</h3>';
  var st=t.sup+t.ret;
  h+='<div class="split">'+(t.sup>0?'<div style="flex:'+t.sup+' 0 0;background:var(--partner);color:var(--partner-ink)">'+nm(c.supplier)+' '+fP(st?t.sup/st:0)+'</div>':'')+(t.ret>0?'<div style="flex:'+t.ret+' 0 0;background:var(--zm-orange);color:#fff">'+nm(c.retailer)+' '+fP(st?t.ret/st:0)+'</div>':'')+'</div>';
  h+='<div class="kv"><span></span><span class="h">'+nm(c.supplier)+'</span><span class="h">'+nm(c.retailer)+'</span>'+
     '<span>Ad spend</span><span class="n">'+fM(t.supAd)+'</span><span class="n">'+fM(t.retAd)+'</span><span>Creative production</span><span class="n">'+fM(t.supCre)+'</span><span class="n">'+fM(t.retCre)+'</span>'+
     '<span class="t">Total</span><span class="t n">'+fM(t.sup)+'</span><span class="t n">'+fM(t.ret)+'</span></div>'+
     (t.fee?'<p class="note">Tax and fees ('+fM(t.fee)+') are not included in the split.</p>':'')+'</div></div></div></section>';

  // objective explorer
  var objs=Object.keys(OBJECTIVES).filter(function(o){return t.byObj[o];});
  if(objs.length){if(!selObj||objs.indexOf(selObj)<0)selObj=objs[0];
    h+='<section class="band" id="objectives" style="padding-top:0"><div class="wrap"><h2>One campaign, '+objs.length+' goal'+(objs.length>1?'s':'')+'</h2><p class="lead">Each ad is set up for one objective. Choose one to see what it does and what it should bring.</p>'+
       '<div class="objtabs" role="tablist" aria-label="Objectives">';
    objs.forEach(function(o){h+='<button type="button" role="tab" class="objtab" data-obj="'+esc(o)+'" aria-selected="'+(o===selObj)+'" aria-controls="objpanel" style="--oc:'+col(o)+';--oink:'+(OBJ_INK[o]||'#fff')+'">'+esc(o)+' <small>'+fM(t.byObj[o])+'</small></button>';});
    h+='</div><div id="objpanel" role="tabpanel"></div></div></section>';
  }

  h+='<section class="band results"><div class="wrap"><h2>What it should deliver</h2><p class="lead">Estimated from expected prices for each platform and format. Change the ad budget below to see how the results scale.</p><div id="metrics"></div>'+
     '<div class="calc"><label for="budgetIn">Ad budget</label><input type="range" id="budgetRange" min="0" step="10" aria-label="Ad budget slider"><div class="money"><input type="number" id="budgetIn" min="0" step="10"><button class="btn" type="button" id="resetBud">Reset</button></div>'+
     '<div class="hint" id="budgetHint"></div></div></div></section>';

  // ads
  h+='<section class="band"><div class="wrap"><h2>The ads</h2><p class="lead">Each ad with its budget, price assumptions and expected result.</p><div class="ads">';
  L.forEach(function(l,i){var k=calc(l);var cr=CR.filter(function(x){return x.id===l.creativeId;})[0];
    h+='<article class="ad"><div class="bar" style="background:'+col(l.objective)+'"></div><div class="body"><h3>'+(i+1)+'. '+esc(l.platform)+'</h3>'+
      '<div class="tags"><button type="button" class="tag obj" data-obj="'+esc(l.objective)+'" title="What does '+esc(l.objective)+' mean?" style="background:'+col(l.objective)+(LIGHT_OBJ[l.objective]?';color:var(--zm-oxford)':'')+'">'+esc(l.objective)+'</button><span class="tag">'+esc(l.format)+'</span>'+(cr?'<span class="tag">Creative: '+esc(cr.format)+'</span>':'')+'</div>'+
      '<div class="facts"><span>Ad spend <b>'+fM(k.spend)+'</b></span><span>Runs <b>'+fD(l.start)+' – '+fD(l.end)+'</b></span><span>'+(l.objective==="Awareness"?'CPM <b>'+fM(l.cpm,2)+'</b>':'Cost per result <b>'+fM(l.cpr,2)+'</b>')+'</span><span>Reach <b>'+fN(k.reach)+'</b> people</span><span>Frequency <b>'+(num(l.freq)!=null?l.freq:'–')+'</b></span><span>Paid by <b>'+nm(pname(l.paidBy))+'</b></span></div>'+howCalc(l,k)+'</div>'+
      '<div class="out"><div class="v">'+fN(k.res)+'</div><div class="l">expected '+esc(k.rtype)+'</div></div></article>';});
  h+='</div></div></section>';

  // creatives
  if(CR.length){
    h+='<section class="band" style="padding-top:0"><div class="wrap"><h2>Creative production</h2><p class="lead">What has to be made for the campaign, at zoommer’s creative price list. Total '+fM(t.cre)+'.</p><div class="creatives">';
    CR.forEach(function(cr){h+='<div class="cre"><div class="img'+(cr.img?' has':'')+'">'+(cr.img?'<img src="'+esc(cr.img)+'" alt="Creative preview">':'Preview will appear here')+'</div><div class="in"><b>'+esc(cr.format)+'</b><br><small>'+esc(cr.scope)+(n0(cr.qty)>1?', '+cr.qty+' pcs':'')+', paid by '+nm(pname(cr.paidBy))+'</small><div class="pr">'+fM(creCost(cr))+'</div></div></div>';});
    h+='</div></div></section>';
  }

  // timeline
  var cs=dt(c.start),ce=dt(c.end);
  if(cs&&ce&&ce>=cs&&L.length){
    var tot=(ce-cs)/864e5+1,nw=Math.ceil(tot/7);
    h+='<section class="band" style="padding-top:0"><div class="wrap"><h2>When the ads run</h2><div class="scroll"><div class="tl"><div class="tl-row"><div></div><div class="tl-track" style="height:26px"><div class="tl-weeks">';
    for(var w=0;w<nw;w++){var ws=new Date(cs.getTime()+w*7*864e5);h+='<div style="flex:'+Math.min(7,tot-w*7)+' 0 0">'+ws.getUTCDate()+' '+MON[ws.getUTCMonth()]+'</div>';}

    var ps=0,as=0;
    act.forEach(function(l){var k=calc(l),a=l.actual||{},i=L.indexOf(l)+1,ratio=(num(a.results)!=null&&k.res)?a.results/k.res:null;ps+=k.spend;as+=n0(a.spend);
      h+='<tr><td>'+i+'. '+esc(l.platform)+', '+esc(l.objective)+'</td><td>'+fM(k.spend)+'</td><td class="act">'+fM(num(a.spend))+'</td><td>'+fN(k.res)+' '+esc(k.rtype)+'</td><td class="act">'+fN(num(a.results))+'</td><td class="'+(ratio==null?'':ratio>=1?'good':ratio<.9?'bad':'')+'">'+fP(ratio)+'</td><td class="act">'+fM((num(a.spend)&&num(a.results))?a.spend/a.results:null,2)+'</td><td class="act">'+fN(num(a.reach))+'</td></tr>';});
    h+='</tbody><tfoot><tr><td>Total</td><td>'+fM(ps)+'</td><td class="act">'+fM(as)+(ps?' ('+fP(as/ps)+')':'')+'</td><td></td><td class="act"></td><td></td><td class="act"></td><td class="act"></td></tr></tfoot></table></div></div></section>';
  }

  h+='<section class="band" style="padding-top:0"><div class="wrap"><details class="gloss"><summary>What the terms mean</summary><dl>'+
     '<dt>Ad spend</dt><dd>Money paid to Facebook, Instagram, Google and other platforms to show the ads.</dd>'+
     '<dt>Creative production</dt><dd>Cost of making the ads themselves: design, video, animation.</dd>'+
     '<dt>Impressions</dt><dd>How many times the ads are shown in total. One person can see an ad several times.</dd>'+
     '<dt>Reach</dt><dd>How many different people see the ad. Not added up across ads, because the same people see several ads.</dd>'+
     '<dt>Frequency</dt><dd>How many times, on average, one person sees the ad.</dd>'+
     '<dt>CPM</dt><dd>Price of 1,000 impressions.</dd>'+
     '<dt>Cost per result</dt><dd>Price of one click, engagement or other result the ad is set up to get.</dd>'+
     '<dt>Awareness / Traffic / Engagement</dt><dd>The goal of the ad: be seen by many people / bring clicks to the website / get likes, comments and shares.</dd></dl></details></div></section>';
  h+='<footer class="foot"><div class="wrap flex"><span class="lock"><span class="wlogo" role="img" aria-label="Zoommer"></span>'+(c.partnerLogo?'<span class="divider"></span><img class="flogo" src="'+esc(c.partnerLogoDark||c.partnerLogo)+'" alt="'+nt(c.supplier)+'">':'')+'</span><small>Prepared by <span class="zm">zoommer</span> for '+nm(c.supplier)+'. Last saved '+(state.updated?new Date(state.updated).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"–")+'.</small></div></footer>';
  document.getElementById("present").innerHTML=h;
  drawRipples();wireCalc(t);renderMetrics();renderObj();
}
function howCalc(l,k){
  var s='<details class="how"><summary>How this is calculated</summary><div>';
  if(num(l.cpm))s+='Impressions = '+fM(k.spend)+' ÷ '+fM(l.cpm,2)+' CPM × 1,000 = <b>'+fN(k.impr)+'</b><br>';
  if(l.objective!=="Awareness"&&num(l.cpr))s+=k.rtype.charAt(0).toUpperCase()+k.rtype.slice(1)+' = '+fM(k.spend)+' ÷ '+fM(l.cpr,2)+' per result = <b>'+fN(k.res)+'</b><br>';
  if(k.reach!=null)s+='Reach = '+fN(k.impr)+' impressions ÷ frequency '+l.freq+' = <b>'+fN(k.reach)+'</b> people<br>';
  if(k.daily!=null)s+='Daily budget = '+fM(k.spend)+' ÷ '+k.days+' days = <b>'+fM(k.daily,2)+'</b>';

function setPath(path,raw,type){

  var arr=parts[0]==="l"?state.lines:parts[0]==="cr"?state.creatives:state.priceList,o=arr[+parts[1]];

      if(kind==="logo"){var pr=processLogo(cv);state.campaign.partnerLogo=pr.light;state.campaign.partnerLogoDark=pr.dark;}else state.creatives[i].img=cv.toDataURL("image/jpeg",.8);changed(true);};
    im.onerror=function(){toast("That file couldn’t be read as an image. Try PNG or JPG.");};im.src=r.result;};
  r.readAsDataURL(f);
}
/* logo: make white background transparent, trim, and build a version for dark backgrounds */
function processLogo(cv){
  var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,d=ctx.getImageData(0,0,W,H),p=d.data,i,hasAlpha=false;
  for(i=3;i<p.length;i+=4)if(p[i]<250){hasAlpha=true;break;}
  if(!hasAlpha){for(i=0;i<p.length;i+=4){var mn=Math.min(p[i],p[i+1],p[i+2]),a=(255-mn)/255;if(a<.03){p[i+3]=0;continue;}
    for(var k=0;k<3;k++)p[i+k]=Math.max(0,Math.min(255,(p[i+k]-255*(1-a))/a));p[i+3]=Math.round(a*255);}}
  var x0=W,y0=H,x1=-1,y1=-1;for(var y=0;y<H;y++)for(var x=0;x<W;x++)if(p[(y*W+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0){x0=0;y0=0;x1=W-1;y1=H-1;}
  var w=x1-x0+1,hh=y1-y0+1,s=Math.min(1,640/Math.max(w,hh));
  function out(data){var t=document.createElement("canvas");t.width=w;t.height=hh;t.getContext("2d").putImageData(data,-x0,-y0);
    var o=document.createElement("canvas");o.width=Math.round(w*s);o.height=Math.round(hh*s);o.getContext("2d").drawImage(t,0,0,o.width,o.height);return o.toDataURL("image/png");}
  var light=out(d),dk=new ImageData(new Uint8ClampedArray(p),W,H),q=dk.data;
  for(i=0;i<q.length;i+=4){var mx=Math.max(q[i],q[i+1],q[i+2]),sat=mx-Math.min(q[i],q[i+1],q[i+2]);if(sat<40&&mx<140){q[i]=q[i+1]=q[i+2]=255;}}
  return {light:light,dark:out(dk)};
}
function changed(rerender){dirty=true;writeDraft();
  if(rerender){var y=window.scrollY;renderEdit();window.scrollTo(0,y);}
  else{var lt=document.getElementById("liveTot");if(lt)lt.innerHTML=liveTotals();}
  renderPresent();updateBar();}

/* ---------- drafts + save ---------- */
function writeDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({base:saved.updated,state:state}));}catch(e){}}
function readDraft(){try{var x=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(x&&x.base===saved.updated&&x.state)return x;}catch(e){}return null;}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function buildHtml(){
  var css=document.getElementById("app-style").textContent,js=document.getElementById("app-js").textContent;
  var data=JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+nt(ctitle()+" — Media plan")+'</title>\n'+
    '<style id="app-style">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script id="plan-data" type="application/json">'+data+'<\/script>\n<script id="app-js">'+js+'<\/script>\n</body>\n</html>\n';
}
function save(){
  if(!artifactNs||saving||!dirty)return;saving=true;updateBar();
  state.updated=new Date().toISOString();var html=buildHtml();clearDraft();
  try{sessionStorage.setItem("zm-mp-mode","edit");}catch(e){}
  artifactNs.publish(html).then(function(){saving=false;dirty=false;toast("Saved. Everyone with the link now sees this version.");updateBar();},
  function(err){saving=false;var code=err&&err.code;
    if(code==="conflict")toast("Someone saved a newer version. Loading it now.");
    else if(code==="not_writer"||code==="not_granted"){readOnly=true;writeDraft();toast("This view is read-only, so changes can’t be saved here.");setMode("present");}
    else if(code==="too_large"){writeDraft();toast("The plan is too large to save. Remove or replace some previews.");}
    else if(code==="rate_limited"){writeDraft();toast("Saving too often. Wait a moment, then save again.");}
    else{writeDraft();toast("Couldn’t save ("+(code||"error")+"). Your edits are kept; try again.");}
    updateBar();});
}

/* ---------- boot ---------- */
shell();renderPresent();updateBar();
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(drawRipples,150);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawRipples);
var wantEdit=location.hash==="#edit";try{if(sessionStorage.getItem("zm-mp-mode")==="edit"){wantEdit=true;sessionStorage.removeItem("zm-mp-mode");}}catch(e){}
if(window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){artifactNs=r[0];var u=r[1];
    return (u?u.canEdit():Promise.resolve(false)).then(function(ce){canEdit=!!(ce&&artifactNs);updateBar();
      if(canEdit&&wantEdit)setMode("edit");else if(canEdit&&readDraft())toast("You have unsaved edits. Open Edit to restore them.");});
  }).catch(function(){updateBar();});
}
window.addEventListener("hashchange",function(){setMode(location.hash==="#edit"?"edit":"present");});
})();
</script>
